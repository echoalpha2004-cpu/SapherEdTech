<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>IPA Chart – Pronunciation Trainer</title>
<link rel="stylesheet" href="style.css">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body>
<main class="ipa-page">

<header class="dash-header">
  <img src="logo.png" class="dash-logo">
  <span class="app-name">IPA Sound Chart</span>
</header>

<p class="ipa-instructions">
  Click any symbol to hear its pronunciation.
</p>

<div class="place-filters">
  <button class="place bilabial">Bilabial</button>
  <button class="place labiodental">Labio-dental</button>
  <button class="place dental">Dental</button>
  <button class="place alveolar">Alveolar</button>
  <button class="place postalveolar">Postalveolar</button>
  <button class="place palatal">Palatal</button>
  <button class="place retroflex">Retroflex</button>
  <button class="place velar">Velar</button>
  <button class="place uvular">Uvular</button>
  <button class="place pharyngeal">Pharyngeal</button>
  <button class="place glottal">Glottal</button>
</div>

<h2 class="ipa-section">Consonants</h2>
<div class="ipa-grid">
  <a href="sound.html?sound=p" class="ipa">p</a>
  <a href="sound.html?sound=b" class="ipa">b</a>
  <a href="sound.html?sound=t" class="ipa">t</a>
  <a href="sound.html?sound=d" class="ipa">d</a>
  <a href="sound.html?sound=k" class="ipa">k</a>
  <a href="sound.html?sound=g" class="ipa">g</a>
</div>

<h2 class="ipa-section">Vowels</h2>
<div class="ipa-grid">
  <a href="sound.html?sound=i" class="ipa">i</a>
  <a href="sound.html?sound=e" class="ipa">e</a>
  <a href="sound.html?sound=a" class="ipa">a</a>
  <a href="sound.html?sound=o" class="ipa">o</a>
  <a href="sound.html?sound=u" class="ipa">u</a>
</div>

</main>

<script>
const sounds = {
  p: "sounds/p.mp3",
  b: "sounds/b.mp3",
  t: "sounds/t.mp3",
  d: "sounds/d.mp3",
  k: "sounds/k.mp3",
  g: "sounds/g.mp3",
  i: "sounds/i.mp3",
  e: "sounds/e.mp3",
  a: "sounds/a.mp3",
  o: "sounds/o.mp3",
  u: "sounds/u.mp3"
};

document.querySelectorAll(".ipa").forEach(btn => {
  btn.addEventListener("click", () => {
    const symbol = btn.dataset.sound;
    const audio = new Audio(sounds[symbol]);
    audio.play();
  });
});
</script>

</body>
</html>
