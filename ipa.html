<main class="ipa-page">

<header class="dash-header">
  <img src="logo.png" class="dash-logo">
  <span class="app-name">IPA Sound Chart</span>
</header>

<p class="ipa-instructions">
  Click any symbol to hear its pronunciation.
</p>

<section class="articulation-diagram">
  <img
    id="articulationImage"
    src="images/head-default.png"
    alt="Articulation diagram"
  />
</section>

<div class="place-filters">
<button class="place show-all" data-place="all" style="background:#adb5bd; color:#000;">
  Show All
</button>
  
  <button class="place bilabial" data-place="bilabial" style="background:#e63946;">Bilabial</button>
  <button class="place labiodental" data-place="labiodental" style="background:#f77f00;">Labio-dental</button>
  <button class="place dental" data-place="dental" style="background:#fcbf49; color:#000;">Dental</button>
  <button class="place alveolar" data-place="alveolar" style="background:#2a9d8f;">Alveolar</button>
  <button class="place postalveolar" data-place="postalveolar" style="background:#264653;">Postalveolar</button>
  <button class="place palatal" data-place="palatal" style="background:#457b9d;">Palatal</button>
  <button class="place retroflex" data-place="retroflex" style="background:#6d597a;">Retroflex</button>
  <button class="place velar" data-place="velar" style="background:#8d6e63;">Velar</button>
  <button class="place uvular" data-place="uvular" style="background:#5e548e;">Uvular</button>
  <button class="place pharyngeal" data-place="pharyngeal" style="background:#9d4edd;">Pharyngeal</button>
  <button class="place glottal" data-place="glottal" style="background:#1d3557;">Glottal</button>
</div>

<h2 class="ipa-section">Consonants</h2>
<div class="ipa-grid">
  <a href="sound.html?sound=p" class="ipa" data-place="bilabial">p</a>
  <a href="sound.html?sound=b" class="ipa" data-place="bilabial">b</a>
  <a href="sound.html?sound=t" class="ipa" data-place="alveolar">t</a>
  <a href="sound.html?sound=d" class="ipa" data-place="alveolar">d</a>
  <a href="sound.html?sound=k" class="ipa" data-place="velar">k</a>
  <a href="sound.html?sound=g" class="ipa" data-place="velar">g</a>
</div>

<h2 class="ipa-section">Vowels</h2>
<div class="ipa-grid">
  <a href="sound.html?sound=i" class="ipa">i</a>
  <a href="sound.html?sound=e" class="ipa">e</a>
  <a href="sound.html?sound=a" class="ipa">a</a>
  <a href="sound.html?sound=o" class="ipa">o</a>
  <a href="sound.html?sound=u" class="ipa">u</a>
</div>

</main>

<script>
  function showDiagram(place) {
    const image = document.getElementById("articulationImage");

    image.src = `images/head-${place}.png`;
    image.alt = `${place} articulation diagram`;
  }
</script>

<script>
document.querySelectorAll(".place").forEach(button => {
  button.addEventListener("click", () => {
    const place = button.dataset.place;
    const image = document.getElementById("articulationImage");

    image.src = `images/head-${place}.png`;
    image.alt = `${place} articulation diagram`;
  });
});
</script>
  
<script>
const sounds = {
  p: "sounds/p.mp3",
  b: "sounds/b.mp3",
  t: "sounds/t.mp3",
  d: "sounds/d.mp3",
  k: "sounds/k.mp3",
  g: "sounds/g.mp3",
  i: "sounds/i.mp3",
  e: "sounds/e.mp3",
  a: "sounds/a.mp3",
  o: "sounds/o.mp3",
  u: "sounds/u.mp3"
};

document.querySelectorAll(".place").forEach(button => {
  button.addEventListener("click", () => {
    const place = button.dataset.place;
    const image = document.getElementById("articulationImage");

    if (place === "all") {
      image.src = "images/head-default.png"; // restore default image
      image.alt = "Default articulation diagram";
    } else {
      image.src = `images/head-${place}.png`;
      image.alt = `${place} articulation diagram`;
    }
  });
});
</script>

<script>
const placeButtons = document.querySelectorAll(".place");
const soundButtons = document.querySelectorAll(".ipa"); // select the actual sound buttons

placeButtons.forEach(btn => {
  btn.addEventListener("click", () => {
    const place = btn.dataset.place;
    const image = document.getElementById("articulationImage");

    // Change the diagram image
    if (place === "all") {
      image.src = "images/head-default.png";
      image.alt = "Default articulation diagram";
    } else {
      image.src = `images/head-${place}.png`;
      image.alt = `${place} articulation diagram`;
    }

    // Filter the sounds
    soundButtons.forEach(sound => {
      if (place === "all" || sound.dataset.place === place) {
        sound.style.display = "inline-block";
      } else {
        sound.style.display = "none";
      }
    });
  });
});
</script>
