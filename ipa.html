<header class="dash-header">
  <img src="logo.png" class="dash-logo">
  <span class="app-name">IPA Sound Chart</span>
</header>

<p class="ipa-instructions">
  Click any symbol to hear its pronunciation.
</p>

<h2 class="ipa-section">Consonants</h2>
<div class="ipa-grid">
  <button class="ipa" data-sound="p">p</button>
  <button class="ipa" data-sound="b">b</button>
  <button class="ipa" data-sound="t">t</button>
  <button class="ipa" data-sound="d">d</button>
  <button class="ipa" data-sound="k">k</button>
  <button class="ipa" data-sound="g">g</button>
</div>

<h2 class="ipa-section">Vowels</h2>
<div class="ipa-grid">
  <button class="ipa" data-sound="i">i</button>
  <button class="ipa" data-sound="e">e</button>
  <button class="ipa" data-sound="a">a</button>
  <button class="ipa" data-sound="o">o</button>
  <button class="ipa" data-sound="u">u</button>
</div>
</script>

</body>
</html>
