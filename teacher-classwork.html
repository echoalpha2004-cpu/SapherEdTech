<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Classwork</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<nav class="top-nav">
  <div class="nav-inner">
    <div class="nav-left">
      <a href="teacher-dashboard.html" class="nav-logo">
        <img src="logo.png" alt="Logo">
        <span>Pronunciation Trainer</span>
      </a>
    </div>

    <div class="nav-links">
      <a href="teacher-classwork.html">Classwork</a>
      <a href="teacher-students.html">Students</a>
      <a href="teacher-announcements.html">Announcements</a>
      <a href="index.html">Log Out</a>
    </div>
  </div>
</nav>

<main class="classwork-page builder-page">
  <header class="dash-header">
    <span class="app-name">Classwork</span>
  </header>

<div class="classwork-section builder-card">
  <input type="text" id="assignmentTitle" placeholder="Assignment / Quiz Name">
  <select id="typeSelect">
    <option value="assignment">Assignment</option>
  </select>
  <button onclick="createClasswork()" class="dash-btn">Create</button>
</div>

<a href="create-quiz.html" class="dash-btn">Create Quiz</a>

<div id="classworkList"></div>

<script>

function getClasswork() {
  return JSON.parse(localStorage.getItem("classwork") || "[]");
}

function saveClasswork(list) {
  localStorage.setItem("classwork", JSON.stringify(list));
}

function renderClasswork() {
  const listDiv = document.getElementById("classworkList");
  listDiv.innerHTML = "";

  const classwork = getClasswork();

  classwork.forEach((item, index) => {
    const div = document.createElement("div");
    div.className = "announcement-item";

    div.innerHTML = `
      <p>${item.title} (${item.type})</p>
      <button onclick="deleteClasswork(${index})" class="dash-btn secondary">Delete</button>
    `;

    listDiv.appendChild(div);
  });
}

function createClasswork() {
  const title = document.getElementById("assignmentTitle").value;
  const type = document.getElementById("typeSelect").value;
  if (!title) return;

  const classwork = getClasswork();
  classwork.push({ title, type });
  saveClasswork(classwork);

  document.getElementById("assignmentTitle").value = "";
  renderClasswork();
}

function deleteClasswork(index) {
  const classwork = getClasswork();
  classwork.splice(index, 1);
  saveClasswork(classwork);
  renderClasswork();
}

renderClasswork();

</script>

<footer class="site-footer">
  <p>Powered by</p>
  <img src="images/powered-by-logo.png" alt="Powered by logo" class="powered-logo">
</footer>

<a href="about.html" class="about-btn">About Us</a>

</body>
</html>
