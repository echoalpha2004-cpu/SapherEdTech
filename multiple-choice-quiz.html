<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>IPA Multiple Choice Quiz</title>
<link rel="stylesheet" href="style.css">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

</head>

<body>

<nav class="top-nav">
  <div class="nav-inner">
    <div class="nav-left">
      <a href="dashboard.html" class="nav-logo">
        <img src="logo.png" alt="Logo">
        <span>Pronunciation Trainer</span>
      </a>
    </div>
  </div>
</nav>

<main class="quiz-page">
  <header class="dash-header">
    <span class="app-name">IPA Multiple Choice Quiz</span>
  </header>

  <div class="quiz-container">
    <div class="quiz-top">
      <div id="questionCounter"></div>
      <div id="timer" class="quiz-timer"></div>
    </div>

    <div id="questionText" class="quiz-question"></div>
    <div id="answers" class="quiz-answers"></div>

    <div class="quiz-controls">
      <button id="prevBtn" class="dash-btn">Previous</button>
      <button id="nextBtn" class="dash-btn">Next</button>
      <button id="submitBtn" class="dash-btn secondary">Submit Quiz</button>
    </div>

    <div id="results" class="quiz-results"></div>
  </div>
</main>

<script>
/* =============================
   LOAD QUIZ DATA
============================= */
const quizData = JSON.parse(localStorage.getItem("currentQuiz"));

if (!quizData) {
  document.querySelector(".quiz-container").innerHTML = "<h2>No quiz loaded.</h2>";
  throw new Error("No quiz found in localStorage");
}

const questions = quizData.questions.map(q => ({
  audio: q.audio,
  options: q.choices,
  correct: q.choices.indexOf(q.correct)
}));

const QUIZ_DURATION = parseInt(quizData.timer) || 60;

/* =============================
   QUIZ STATE
============================= */
let currentQuestion = parseInt(localStorage.getItem("quizCurrent")) || 0;
let userAnswers = JSON.parse(localStorage.getItem("quizAnswers")) || new Array(questions.length).fill(null);
let timerInterval;
let startTime = parseInt(localStorage.getItem("quizStartTime")) || Date.now();
localStorage.setItem("quizStartTime", startTime);

/* =============================
   LOAD QUESTION
============================= */
function loadQuestion() {
  const question = questions[currentQuestion];
  document.getElementById("questionCounter").textContent = `Question ${currentQuestion + 1} of ${questions.length}`;
  document.getElementById("questionText").innerHTML = `<audio controls src="${question.audio}"></audio>`;

  const answersDiv = document.getElementById("answers");
  answersDiv.innerHTML = "";

  question.options.forEach((option, index) => {
    const btn = document.createElement("button");
    btn.className = "answer-btn";
    btn.textContent = option;
    if (userAnswers[currentQuestion] === index) btn.classList.add("selected");

    btn.onclick = () => {
      userAnswers[currentQuestion] = index;
      localStorage.setItem("quizAnswers", JSON.stringify(userAnswers));
      loadQuestion(); // refresh selection highlight
    };

    answersDiv.appendChild(btn);
  });
}

/* =============================
   NAVIGATION
============================= */
document.getElementById("nextBtn").onclick = () => {
  if (currentQuestion < questions.length - 1) {
    currentQuestion++;
    localStorage.setItem("quizCurrent", currentQuestion);
    loadQuestion();
  }
};

document.getElementById("prevBtn").onclick = () => {
  if (currentQuestion > 0) {
    currentQuestion--;
    localStorage.setItem("quizCurrent", currentQuestion);
    loadQuestion();
  }
};

/* =============================
   SUBMIT QUIZ
============================= */
document.getElementById("submitBtn").onclick = submitQuiz;

function submitQuiz() {
  clearInterval(timerInterval);

  let score = 0;
  questions.forEach((q, index) => {
    if (userAnswers[index] === q.correct) score++;
  });

  document.getElementById("results").innerHTML = `
    <h3>Quiz Complete</h3>
    <p>You scored ${score} out of ${questions.length}</p>
    <p>Percentage: ${Math.round((score / questions.length) * 100)}%</p>
  `;
  document.querySelector(".quiz-controls").style.display = "none";
  document.getElementById("answers").style.display = "none";
  document.getElementById("questionText").style.display = "none";

  // clear saved quiz state
  localStorage.removeItem("quizStartTime");
  localStorage.removeItem("quizAnswers");
  localStorage.removeItem("quizCurrent");
}

/* =============================
   TIMER (PERSISTENT)
============================= */
function startTimer() {
  const timerDisplay = document.getElementById("timer");

  timerInterval = setInterval(() => {
    const elapsed = Math.floor((Date.now() - startTime) / 1000);
    const remaining = QUIZ_DURATION - elapsed;

    timerDisplay.textContent = `Time Remaining: ${remaining}s`;

    if (remaining <= 0) submitQuiz();
  }, 1000);
}

/* =============================
   START QUIZ
============================= */
loadQuestion();
startTimer();
</script>

</body>
</html>
