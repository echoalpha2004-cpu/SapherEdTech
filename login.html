<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Log In – Pronunciation Trainer</title>
<link rel="stylesheet" href="style.css">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body>
<main class="home">

  <div class="actions vertical">

    <!-- Login type selection -->
<button class="login-option" onclick="showStudentLogin()">Student Login</button>
<button class="login-option" onclick="showTeacherLogin()">Teacher Login</button>

<div id="student-login" class="login-box hidden">
  <input type="text" placeholder="Student Number">
  <input type="email" placeholder="Student Email">
  <input type="password" placeholder="Password">
  <button class="login-option" onclick="loginStudent()">Log In</button>
</div>

<div id="teacher-login" class="login-box hidden">
  <input type="email" placeholder="Teacher Email">
  <input type="password" placeholder="Password">
  <button class="login-option" onclick="loginTeacher()">Log In</button>
</div>



    <div class="divider">or</div>

    <a href="plans.html" class="create-btn">Create an account</a>

  </div>


 <div class="home-image">
  <img src="images/home-image.png" alt="logim">
 </div>

</main>

<script>
function showStudentLogin() {
  document.getElementById("student-login").classList.remove("hidden");
  document.getElementById("teacher-login").classList.add("hidden");
}

function showTeacherLogin() {
  document.getElementById("teacher-login").classList.remove("hidden");
  document.getElementById("student-login").classList.add("hidden");
}

function loginStudent() {
  window.location.href = "dashboard.html";
}

function loginTeacher() {
  window.location.href = "teacher-dashboard.html";
}
</script>


<footer class="site-footer">
  <p>Powered by</p>
  <img src="images/powered-by-logo.png" alt="Powered by logo" class="powered-logo">
</footer>

<a href="about.html" class="about-btn">About Us</a>

</body>
</html>
