<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Log In – Pronunciation Trainer</title>
<link rel="stylesheet" href="style.css">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body>
  <main class="home">

<div class="actions vertical">

  <button class="login-option" onclick="showStudentLogin()">Student Number</button>
  <button class="login-option">School Email</button>
  <button class="login-option">Email & Password</button>

  <div id="student-login" class="student-login hidden">
    <input type="text" id="studentId" placeholder="Enter your student number">
    <button class="login-option" onclick="loginStudent()">Log In</button>
  </div>

  <div class="divider">or</div>

  <a href="plans.html" class="create-btn">Create an account</a>

</div>


  </main>

<script>
function showStudentLogin() {
  document.getElementById("student-login").classList.remove("hidden");
}

function loginStudent() {
  const id = document.getElementById("studentId").value;

  if (id.trim() === "") {
    alert("Please enter your student number.");
    return;
  }

  // For now, we accept any number
  window.location.href = "dashboard.html";
}
</script>

<footer class="site-footer">
  <p>Powered by</p>
  <img src="images/powered-by-logo.png" alt="Powered by logo" class="powered-logo">
</footer>

</body>
</html>
