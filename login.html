<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Log In – Pronunciation Trainer</title>
<link rel="stylesheet" href="style.css">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body>
<main class="home">

  <div class="actions vertical">

    <!-- Login type selection -->
    <button class="login-option" onclick="showLogin('student')">Student Login</button>
    <button class="login-option" onclick="showLogin('teacher')">Teacher Login</button>

    <!-- STUDENT LOGIN -->
    <div id="student-login" class="login-box hidden">
      <input type="text" id="studentNumber" placeholder="Student Number">
      <input type="email" id="studentEmail" placeholder="Student Email">
      <input type="password" id="studentPassword" placeholder="Password">

      <button class="login-option" onclick="loginStudent()">Log In as Student</button>
    </div>

    <!-- TEACHER LOGIN -->
    <div id="teacher-login" class="login-box hidden">
      <input type="email" id="teacherEmail" placeholder="Teacher Email">
      <input type="password" id="teacherPassword" placeholder="Password">

      <button class="login-option" onclick="loginTeacher()">Log In as Teacher</button>
    </div>

    <div class="divider">or</div>

    <a href="plans.html" class="create-btn">Create an account</a>

  </div>

</main>

<script>
function showLogin(type) {
  document.getElementById("student-login").classList.add("hidden");
  document.getElementById("teacher-login").classList.add("hidden");

  if (type === "student") {
    document.getElementById("student-login").classList.remove("hidden");
  } else {
    document.getElementById("teacher-login").classList.remove("hidden");
  }
}

function loginStudent() {
  const number = document.getElementById("studentNumber").value;
  const email = document.getElementById("studentEmail").value;
  const password = document.getElementById("studentPassword").value;

  if (!number || !email || !password) {
    alert("Please fill in all student fields.");
    return;
  }

  // Placeholder auth
  window.location.href = "dashboard.html";
}

function loginTeacher() {
  const email = document.getElementById("teacherEmail").value;
  const password = document.getElementById("teacherPassword").value;

  if (!email || !password) {
    alert("Please fill in all teacher fields.");
    return;
  }

  // Placeholder auth
  window.location.href = "teacher-dashboard.html";
}
</script>

<footer class="site-footer">
  <p>Powered by</p>
  <img src="images/powered-by-logo.png" alt="Powered by logo" class="powered-logo">
</footer>

<a href="about.html" class="about-btn">About Us</a>

</body>
</html>
