<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Student Dashboard – Pronunciation Trainer</title>
<link rel="stylesheet" href="style.css">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body>
<main class="dashboard">

  <header class="dash-header">
    <img src="logo.png" alt="App Logo" class="dash-logo">
    <span class="app-name">Pronunciation Trainer</span>
  </header>

  <div class="profile">
    <img src="pfp.png" alt="Profile Picture" class="pfp">
    <h2>John Doe</h2>
    <p class="language-label">Currently Learning: Outlandish</p>
  </div>

    <div class="dashboard-buttons">
      <button class="dash-btn">Inbox</button>
      <a href="ipa.html" class="dash-btn">IPA Sound Chart</a>
      <button class="dash-btn">Speed Articulation</button>
      <button class="dash-btn">Upcoming Assignments</button>
      <button class="dash-btn">Pronunciation Practice</button>
    </div>

  </main>
</body>
</html>
