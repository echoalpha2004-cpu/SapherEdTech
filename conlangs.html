<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Conlangs – Pronunciation Trainer</title>
<link rel="stylesheet" href="style.css">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body class="app">

<!-- Top Nav -->
<nav class="top-nav">
  <div class="nav-inner">
    <div class="nav-left">
      <a href="dashboard.html" class="nav-logo">
        <img src="logo.png" alt="Logo">
        <span>Pronunciation Trainer</span>
      </a>
    </div>

    <div class="nav-links">
      <a href="dashboard.html">Dashboard</a>
      <a href="inbox.html">Inbox</a>
      <a href="assignments.html">Assignments</a>
      <a href="ipa.html">IPA Chart</a>
      <a href="speed-articulation.html">Speed</a>
      <a href="games.html">Games</a>
      <a href="conlangs.html">Conlangs</a>
    </div>
  </div>
</nav>

<main class="home">

  <header class="dash-header">
    <img src="logo.png" class="dash-logo" alt="Logo">
    <span class="app-name">Constructed Language Builder</span>
  </header>

  <!-- Intro -->
  <p class="page-intro">
    Create your own constructed language by defining its sounds, grammar, and number system.
  </p>

<h2 class="section-title">My Conlangs</h2>
<div id="conlangList" class="word-bank"></div>
  
  <!-- Language Name -->
  <div class="content-box">
    <h3>Language Name</h3>
    <input type="text" placeholder="Enter language name..." class="text-input">
  </div>

  <!-- Phonology -->
  <div class="content-box">
    <h3>Phonology</h3>
    <textarea placeholder="List sounds, IPA symbols, stress rules, phonotactics..."></textarea>
  </div>

  <!-- Pronouns -->
  <div class="content-box">
    <h3>Pronouns</h3>
    <textarea placeholder="Describe personal pronouns, cases, gender, formality..."></textarea>
  </div>

  <!-- Verbs -->
  <div class="content-box">
    <h3>Verbs</h3>
    <textarea placeholder="Verb conjugation, tense, aspect, mood..."></textarea>
  </div>

  <!-- Cardinal Numbers -->
  <div class="content-box">
    <h3>Cardinal Numbers</h3>
    <textarea placeholder="Number system, base, examples (1–10, etc.)..."></textarea>
  </div>

  <!-- Save / Continue -->
  <div class="action-row">
    <button class="dash-btn">Save Language</button>
    <button class="dash-btn secondary">Continue Later</button>
    <button class="dash-btn" id="saveLanguage">Save Language</button>
  </div>

</main>

<script>
const saveBtn = document.getElementById("saveLanguage");

saveBtn.addEventListener("click", () => {
  const language = {
    id: Date.now().toString(),
    name: document.getElementById("langName").value.trim(),
    phonology: document.getElementById("phonology").value,
    pronouns: document.getElementById("pronouns").value,
    verbs: document.getElementById("verbs").value,
    numbers: document.getElementById("numbers").value,
    createdAt: Date.now()
  };

  if (!language.name) {
    alert("Language name is required");
    return;
  }

  const conlangs = JSON.parse(localStorage.getItem("conlangs")) || [];
  conlangs.push(language);
  localStorage.setItem("conlangs", JSON.stringify(conlangs));

  window.location.href = "conlangs.html";
});
</script>

<script>
const listEl = document.getElementById("conlangList");
const conlangs = JSON.parse(localStorage.getItem("conlangs")) || [];

if (conlangs.length === 0) {
  listEl.innerHTML = "<p>No languages created yet.</p>";
}

conlangs.forEach(lang => {
  const card = document.createElement("div");
  card.className = "ipa-card";

  card.innerHTML = `
    <h3>${lang.name}</h3>
    <button class="dash-btn" onclick="openLang('${lang.id}')">Edit</button>
    <button class="dash-btn danger" onclick="deleteLang('${lang.id}')">Delete</button>
  `;

  listEl.appendChild(card);
});

function openLang(id) {
  window.location.href = `conlang-edit.html?id=${id}`;
}

function deleteLang(id) {
  if (!confirm("Delete this language?")) return;

  const updated = conlangs.filter(l => l.id !== id);
  localStorage.setItem("conlangs", JSON.stringify(updated));
  location.reload();
}
</script>



<footer class="site-footer">
  <p>Powered by</p>
  <img src="images/powered-by-logo.png" alt="Powered by logo" class="powered-logo">
</footer>

</body>
</html>
