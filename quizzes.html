</head>
<body>

<nav class="top-nav">
  <div class="nav-inner">
    <div class="nav-left">
      <a href="dashboard.html" class="nav-logo">
        <img src="logo.png" alt="Logo">
        <span>Pronunciation Trainer</span>
      </a>
    </div>

    <div class="nav-links">
      <a href="dashboard.html">Dashboard</a>

<main class="quizzes">
<header class="dash-header">
  <span class="app-name">Quizzes</span>
</header>

     <div class="quizzes-image">
  <img src="images/quizzes-image.png" alt="quizim">
   </div>

<p class="ipa-instructions">
  Here are all of your assigned pronunciation quizzes.
</p>

<section class="quiz-section">
  <h2 class="ipa-section">Available Quizzes</h2>
  <div class="quiz-list"></div>
</section>
</main>

<script>
function loadQuizzes() {
  const quizList = document.querySelector(".quiz-list");
  quizList.innerHTML = "";

  const classwork = JSON.parse(localStorage.getItem("classwork") || "[]");
  const quizzes = classwork.filter(item => item.type === "quiz");

  if (quizzes.length === 0) {
    quizList.innerHTML = "<p>No quizzes assigned.</p>";
    return;
  }

  quizzes.forEach(quiz => {
    const card = document.createElement("div");
    card.className = "quiz-card";
    card.innerHTML = `
      <h3>${quiz.title}</h3>
      <p>${quiz.description || "Test your knowledge."}</p>
      <button class="dash-btn start-quiz">Start Quiz</button>
    `;
    card.querySelector(".start-quiz").onclick = () => {
      localStorage.setItem("currentQuiz", JSON.stringify(quiz));
      localStorage.setItem("quizStartTime", Date.now()); // initialize timer for new attempt
      localStorage.setItem("quizAnswers", JSON.stringify(new Array(quiz.questions.length).fill(null)));
      localStorage.setItem("quizCurrent", 0);
      window.location.href = "multiple-choice-quiz.html";
    };
    quizList.appendChild(card);
  });
}

loadQuizzes();
</script>

<a href="about.html" class="about-btn">About Us</a>

</body>
</html>
