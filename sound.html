<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>IPA Sound</title>
<link rel="stylesheet" href="style.css">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body>

<nav class="top-nav">
  <div class="nav-inner">
    <div class="nav-left">
      <a href="dashboard.html" class="nav-logo">
        <img src="logo.png" alt="Logo">
        <span>Pronunciation Trainer</span>
      </a>
    </div>

    <div class="nav-links">
      <a href="dashboard.html">Dashboard</a>
      <a href="inbox.html">Inbox</a>
      <a href="assignments.html">Assignments</a>
      <a href="ipa.html">IPA Chart</a>
      <a href="speed-articulation.html">Speed</a>
      <a href="practice.html">Practice</a>
      <a href="games.html">Games</a>
      <a href="conlangs.html">Conlangs</a>
    </div>
  </div>
</nav>

<main class="sound-page">

  <header class="dash-header">
    <span class="app-name">Pronunciation Trainer</span>
  </header>

  <div class="sound-card">
    <div id="symbol" class="sound-symbol">?</div>
    <p id="sound-name" class="sound-name"></p>

<button id="playBtn" class="select-btn">Play Sound</button>

<button id="pinBtn" class="select-btn secondary">Pin to Practice</button>

<button class="print-btn">Print pronunciation guide slip</button>

<div class="instructions" id="instructions"></div>

<div id="illustration" class="illustration"></div>

<p id="pinStatus" class="pin-status"></p>

    <div class="instructions" id="instructions"></div>
  </div>

</main>

<script>
const params = new URLSearchParams(window.location.search);
const sound = params.get("sound");

const sounds = {
  // CONSONANTS
  p: {
    file: "sounds/p.mp3",
    name: "Voiceless bilabial plosive",
    type: "consonant",
    place: "bilabial",
    manner: "plosive",
    voicing: "voiceless"
  },
  b: {
    file: "sounds/b.mp3",
    name: "Voiced bilabial plosive",
    type: "consonant",
    place: "bilabial",
    manner: "plosive",
    voicing: "voiced"
  },
  t: {
    file: "sounds/t.mp3",
    name: "Voiceless alveolar plosive",
    type: "consonant",
    place: "alveolar",
    manner: "plosive",
    voicing: "voiceless"
  },
  d: {
    file: "sounds/d.mp3",
    name: "Voiced alveolar plosive",
    type: "consonant",
    place: "alveolar",
    manner: "plosive",
    voicing: "voiced"
  },
  k: {
    file: "sounds/k.mp3",
    name: "Voiceless velar plosive",
    type: "consonant",
    place: "velar",
    manner: "plosive",
    voicing: "voiceless"
  },
  g: {
    file: "sounds/g.mp3",
    name: "Voiced velar plosive",
    type: "consonant",
    place: "velar",
    manner: "plosive",
    voicing: "voiced"
  },

  // VOWELS
  i: {
    file: "sounds/i.mp3",
    name: "Close front unrounded vowel",
    type: "vowel",
    height: "close",
    backness: "front",
    rounding: "unrounded"
  },
  e: {
    file: "sounds/e.mp3",
    name: "Close-mid front unrounded vowel",
    type: "vowel",
    height: "closeMid",
    backness: "front",
    rounding: "unrounded"
  },
  a: {
    file: "sounds/a.mp3",
    name: "Open front unrounded vowel",
    type: "vowel",
    height: "open",
    backness: "front",
    rounding: "unrounded"
  },
  o: {
    file: "sounds/o.mp3",
    name: "Close-mid back rounded vowel",
    type: "vowel",
    height: "closeMid",
    backness: "back",
    rounding: "rounded"
  },
  u: {
    file: "sounds/u.mp3",
    name: "Close back rounded vowel",
    type: "vowel",
    height: "close",
    backness: "back",
    rounding: "rounded"
  }
};

// -------- CONSONANT INSTRUCTION PARTS --------
const placeInstructions = {
  bilabial: "Press your lips together.",
  alveolar: "Touch your tongue to the ridge behind your upper teeth.",
  velar: "Raise the back of your tongue to the soft palate."
};

const mannerInstructions = {
  plosive: "Block the airflow, build pressure, then release it suddenly."
};

const voicingInstructions = {
  voiced: "Vibrate your vocal cords.",
  voiceless: "Do not vibrate your vocal cords."
};

// -------- VOWEL INSTRUCTION PARTS --------
const heightInstructions = {
  close: "Raise your tongue high in your mouth.",
  closeMid: "Keep your tongue slightly lower than a close vowel.",
  open: "Lower your tongue fully in your mouth."
};

const backnessInstructions = {
  front: "Move your tongue forward.",
  back: "Move your tongue toward the back of your mouth."
};

const roundingInstructions = {
  rounded: "Round your lips.",
  unrounded: "Keep your lips relaxed."
};

function generateInstructions(soundData) {
  if (soundData.type === "consonant") {
    return `
${placeInstructions[soundData.place]}
${mannerInstructions[soundData.manner]}
${voicingInstructions[soundData.voicing]}
    `;
  }

  if (soundData.type === "vowel") {
    return `
${heightInstructions[soundData.height]}
${backnessInstructions[soundData.backness]}
${roundingInstructions[soundData.rounding]}
Let air flow smoothly without blocking it.
    `;
  }
}


if (sounds[sound]) {
  document.getElementById("symbol").textContent = sound;
  document.getElementById("sound-name").textContent = sounds[sound].name;
  document.getElementById("instructions").textContent =
  generateInstructions(sounds[sound]);

  // ---- NEW CODE FOR ILLUSTRATION ----
  const illustrations = {
    p: "images/p-illustration.png",
    b: "images/b-illustration.png",
    t: "images/t-illustration.png",
    d: "images/d-illustration.png",
    k: "images/k-illustration.png",
    g: "images/g-illustration.png",
    i: "images/i-illustration.png",
    e: "images/e-illustration.png",
    a: "images/a-illustration.png",
    o: "images/o-illustration.png",
    u: "images/u-illustration.png"
  };

  const illustrationDiv = document.getElementById("illustration");
  if (illustrations[sound]) {
    const img = document.createElement("img");
    img.src = illustrations[sound];
    img.alt = `${sound} articulation illustration`;
    img.style.maxWidth = "90%";      // adjust size if needed
    img.style.display = "block";
    img.style.margin = "1rem auto 0";

    illustrationDiv.appendChild(img);
  }
  // -----------------------------------

  document.getElementById("playBtn").onclick = () => {
    new Audio(sounds[sound].file).play();
  };
}

pinBtn.onclick = () => {
let pins = JSON.parse(localStorage.getItem("practicePins")) || [];
if (pins.includes(sound)) {
  pinStatus.textContent = "Pinned for practice ✔";
  pinBtn.textContent = "Unpin from Practice";
}

  if (!pins.includes(sound)) {
    // Pin it
    pins.push(sound);
    localStorage.setItem("practicePins", JSON.stringify(pins));
    pinStatus.textContent = "Pinned for practice ✔";
    pinBtn.textContent = "Unpin from Practice";
  } else {
    // Unpin it
    pins = pins.filter(s => s !== sound);
    localStorage.setItem("practicePins", JSON.stringify(pins));
    pinStatus.textContent = "Removed from practice";
    pinBtn.textContent = "Pin to Practice";
  }
};

</script>

<a href="about.html" class="about-btn">About Us</a>

</body>
</html>
