// -------- CONSONANT INSTRUCTION PARTS --------
const placeInstructions = {
  bilabial: "Press your lips together.",
  alveolar: "Touch your tongue to the ridge behind your upper teeth.",
  postalveolar: "Touch your tongue to the space above the ridge behind your upper teeth.",
  velar: "Raise the back of your tongue to the soft palate.",
  uvular: "Touch your tongue to your uvula.",
  dental: "Touch your tongue to your upper teeth.",
  labiodental: "Place your lower lips against your upper teeth.",
  pharyngeal: "Restrict the airflow by bringing your tongue to the back wall of your mouth.",
  glottal: "Restrict the airflow from your throat, the tongue is not involved."
  
};

const mannerInstructions = {
  plosive: "Block the airflow, build pressure, then release it suddenly.",
  fricative: "Force the airflow through a narrow channel, creating audible friction.",
  nasal: "Block airflow from your mouth by lowering your soft palate, and push that air through your nose instead,",
  trill: "Rapidly vibrate the two parts while pushing air from your throat.",
  tap: "Push airflow and quickly tap your tongue.",
  latFricative: "Force the airflow through two narrow channels on the sides of your tongue by raising your tongue, creating audible friction.",
  approximant: "Bring your tongue almost near the top of your mouth without touching it, and push air.",
  latApproximant: "Bring your tongue almost near the top of your mouth without touching it, and force the airflow through two narrow channels on the sides of your tongue by raising your tongue."
};

const voicingInstructions = {
  voiced: "Vibrate your vocal cords.",
  voiceless: "Do not vibrate your vocal cords."
};

// -------- VOWEL INSTRUCTION PARTS --------
const heightInstructions = {
  close: "Raise your tongue high in your mouth, your bottom jaw should be closed.",
  nearClose: "Your bottom jaw should be slightly more open than closed.",
  closeMid: "Keep your tongue slightly lower than a close vowel, your bottom jaw should be slightly above the middle of its range.",
  mid: "Your bottom jaw should be at the centre of its range.",
  openMid: "Keep your tongue slightly higher than an open vowel, your bottom jaw should be slightly below the middle of its range",
  nearOpen: "Your bottom jaw should be slightly more open than closed.",
  open: "Lower your tongue fully in your mouth."
};

const backnessInstructions = {
  front: "Move your tongue forward, your lips should be most unstressed",
  nearFront: "Move your tongue between the middle and back of your mouth.",
  central: "Move your tongue toward the middle of your mouth.",
  nearBack: "Move your tongue between the middle and back of your mouth.",
  back: "Move your tongue toward the back of your mouth, your lips should be most unstressed."
};

const roundingInstructions = {
  rounded: "Round your lips.",
  unrounded: "Do not round your lips."
};

function generateInstructions(soundData) {
  if (soundData.type === "consonant") {
    return `
${placeInstructions[soundData.place]}
${mannerInstructions[soundData.manner]}
${voicingInstructions[soundData.voicing]}
    `;
  }

  if (soundData.type === "vowel") {
    return `
${heightInstructions[soundData.height]}
${backnessInstructions[soundData.backness]}
${roundingInstructions[soundData.rounding]}
Let air flow smoothly without blocking it.
    `;
  }
}


if (sounds[sound]) {
  document.getElementById("symbol").textContent = sound;
  document.getElementById("sound-name").textContent = sounds[sound].name;

pinBtn.onclick = () => {

if (pins.includes(sound)) {
  pinStatus.textContent = "Pinned for practice ✔";
  pinBtn.textContent = "Unpin from Practice";
}

  if (!pins.includes(sound)) {
    // Pin it
    pins.push(sound);
    localStorage.setItem("practicePins", JSON.stringify(pins));
    pinStatus.textContent = "Pinned for practice ✔";
    pinBtn.textContent = "Unpin from Practice";
  } else {
    // Unpin it
    pins = pins.filter(s => s !== sound);
    localStorage.setItem("practicePins", JSON.stringify(pins));
    pinStatus.textContent = "Removed from practice";
    pinBtn.textContent = "Pin to Practice";
  }
};
