<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<link rel="stylesheet" href="style.css">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body>

<nav class="top-nav">
  <div class="nav-inner">
    <div class="nav-left">
      <a href="dashboard.html" class="nav-logo">
        <img src="logo.png" alt="Logo">
        <span>Pronunciation Trainer</span>
      </a>
    </div>

    <div class="nav-links">
      <a href="dashboard.html">Dashboard</a>
      <a href="inbox.html">Inbox</a>
      <a href="assignments.html">Assignments</a>
      <a href="ipa.html">IPA Chart</a>
      <a href="speed-articulation.html">Speed</a>
      <a href="practice.html">Practice</a>
      <a href="games.html">Games</a>
      <a href="conlangs.html">Conlangs</a>
    </div>
  </div>
</nav>

<main class="sound-page">

  <header class="dash-header">
    <span class="app-name">Pronunciation Trainer</span>
  </header>

  <div class="sound-card">
    <div id="symbol" class="sound-symbol">?</div>
    <p id="sound-name" class="sound-name"></p>

<button id="playBtn" class="select-btn">Play Sound</button>

<button id="pinBtn" class="select-btn secondary">Pin to Practice</button>

<button class="print-btn">Print pronunciation guide slip</button>

<div class="instructions" id="instructions"></div>

<div id="illustration" class="illustration"></div>

<p id="pinStatus" class="pin-status"></p>

    <div class="instructions" id="instructions"></div>
  </div>

</main>

<script>
const params = new URLSearchParams(window.location.search);
const sound = params.get("sound");

const sounds = {
  p: {
    file: "sounds/p.mp3",
    name: "Voiceless bilabial plosive",
    instructions: "Press your lips together, build up air, then release it suddenly without vibrating your vocal cords."
  },
  b: {
    file: "sounds/b.mp3",
    name: "Voiced bilabial plosive",
    instructions: "Press your lips together and release, push air from your throat, and open your mouth."
  },
  i: {
    file: "sounds/i.mp3",
    name: "Close-front unrounded vowel",
    instructions: "Raise your tongue high and forward, and push air through your mouth while keeping your teeth close to eachother."
  },
  t: {
    file: "sounds/t.mp3",
    name: "Voiceless alveolar plosive",
    instructions: "Bring your teeth close to eachother, touch the gums right above your teeth, and push air through your throat."
  },
  d: {
    file: "sounds/d.mp3",
    name: "Voiced alveolar plosive",
    instructions: "Bring your teeth close to eachother, touch the gums high above your teeth, and push air through your throat."
  },
  k: {
    file: "sounds/k.mp3",
    name: "Voiceless velar plosive",
    instructions: "Press the back of the tongue against the roof of the mouth to block air, then release a sharp puff of air."
  },
  g: {
    file: "sounds/g.mp3",
    name: "Voiced velar plosive",
    instructions: "Press the back of the tongue against the roof of the mouth to block air, tense up your throat, then release a sharp puff of air."
  },
  e: {
    file: "sounds/e.mp3",
    name: "Close-mid front unrounded vowel",
    instructions: "Place the tongue high-front in the mouth, smile slightly, and push a breathe of air from your throat."
  },
  a: {
    file: "sounds/a.mp3",
    name: "Open-front unrounded vowel",
    instructions: "Open your mouth, put your tongue low and forward in your mouth, and push a breathe of air from your throat."
  },
  o: {
    file: "sounds/o.mp3",
    name: "Close-mid back rounded vowel",
    instructions: "Round your lips, place your tongue on the middle portion at the top of the mouth, and push a breathe of air from your throat."
  },
  u: {
    file: "sounds/u.mp3",
    name: "Close-back rounded vowel",
    instructions: "Create a tight, round, circle with your lips, place your tongue on the back portion at the top of the mouth, and push a breathe of air from your throat."
  }
};

if (sounds[sound]) {
  document.getElementById("symbol").textContent = sound;
  document.getElementById("sound-name").textContent = sounds[sound].name;
  document.getElementById("instructions").textContent = sounds[sound].instructions;

  // ---- NEW CODE FOR ILLUSTRATION ----
  const illustrations = {
    p: "images/p-illustration.png",
    b: "images/b-illustration.png",
    t: "images/t-illustration.png",
    d: "images/d-illustration.png",
    k: "images/k-illustration.png",
    g: "images/g-illustration.png",
    i: "images/i-illustration.png",
    e: "images/e-illustration.png",
    a: "images/a-illustration.png",
    o: "images/o-illustration.png",
    u: "images/u-illustration.png"
  };

  const illustrationDiv = document.getElementById("illustration");
  if (illustrations[sound]) {
    const img = document.createElement("img");
    img.src = illustrations[sound];
    img.alt = `${sound} articulation illustration`;
    img.style.maxWidth = "90%";      // adjust size if needed
    img.style.display = "block";
    img.style.margin = "1rem auto 0";

    illustrationDiv.appendChild(img);
  }
  // -----------------------------------

  document.getElementById("playBtn").onclick = () => {
    new Audio(sounds[sound].file).play();
  };
}

<script>
const pinBtn = document.getElementById("pinBtn");
const pinStatus = document.getElementById("pinStatus");

pinBtn.onclick = () => {
  let pins = JSON.parse(localStorage.getItem("practicePins")) || [];

  if (!pins.includes(sound)) {
    pins.push(sound);
    localStorage.setItem("practicePins", JSON.stringify(pins));
    pinStatus.textContent = "Pinned for practice ✔";
  } else {
    pinStatus.textContent = "Already in your practice list";
  }
};

</script>

<a href="about.html" class="about-btn">About Us</a>

</body>
</html>
