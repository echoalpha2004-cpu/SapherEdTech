<main class="home">

  <header class="dash-header">
    <span class="app-name">Upcoming Assignments</span>
  </header>

  <div id="assignmentsContainer"></div>

</main>

<script>
function loadAssignments() {
  const container = document.getElementById("assignmentsContainer");
  container.innerHTML = "";

  const classwork = JSON.parse(localStorage.getItem("classwork") || "[]");
  const assignments = classwork.filter(item => item.type === "assignment");

  if (assignments.length === 0) {
    container.innerHTML = "<p>No assignments assigned yet.</p>";
    return;
  }

  assignments.forEach(assign => {
    const card = document.createElement("div");
    card.className = "assignment-card";
    card.innerHTML = `
      <h3>${assign.title}</h3>
      <p>${assign.description || "No details provided."}</p>
    `;
    container.appendChild(card);
  });
}

loadAssignments();
</script>
