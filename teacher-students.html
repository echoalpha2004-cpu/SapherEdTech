<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Students</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<nav class="top-nav">
  <div class="nav-inner">
    <div class="nav-left">
      <a href="teacher-dashboard.html" class="nav-logo">
        <img src="logo.png" alt="Logo">
        <span>Pronunciation Trainer</span>
      </a>
    </div>

    <div class="nav-links">
      <a href="teacher-classwork.html">Classwork</a>
      <a href="teacher-students.html">Students</a>
      <a href="teacher-announcements.html">Announcements</a>
      <a href="index.html">Log Out</a>
    </div>
  </div>
</nav>

<main class="students-page builder-page">

  <header class="dash-header">
    <span class="app-name">Students</span>
  </header>

  <div class="students-container">
    <!-- Example student cards -->
    <div class="builder-card student-card">
      <h3>Jane Doe</h3>
      <div class="progress-bar">
        <div class="progress-fill" style="width: 70%;"></div>
      </div>
      <p>Assignments Completed: 7 / 10</p>
    </div>

    <div class="builder-card student-card">
      <h3>John Smith</h3>
      <div class="progress-bar">
        <div class="progress-fill" style="width: 50%;"></div>
      </div>
      <p>Assignments Completed: 5 / 10</p>
    </div>
  </div>

</main>

<script>

const students = [
  { name: "Emily Johnson", assignments: 80, quizzes: 70 },
  { name: "Michael Smith", assignments: 55, quizzes: 60 },
  { name: "Sophia Lee", assignments: 95, quizzes: 90 }
];

const container = document.getElementById("studentsList");

students.forEach(student => {

  const overall = Math.round((student.assignments + student.quizzes) / 2);

  const card = document.createElement("div");
  card.className = "student-card";

  card.innerHTML = `
    <h3>${student.name}</h3>
    <p>Assignments: ${student.assignments}%</p>
    <p>Quizzes: ${student.quizzes}%</p>
    <div class="progress-bar">
      <div class="progress-fill" style="width:${overall}%"></div>
    </div>
    <p>Overall Progress: ${overall}%</p>
  `;

  container.appendChild(card);
});

</script>

<footer class="site-footer">
  <p>Powered by</p>
  <img src="images/powered-by-logo.png" alt="Powered by logo" class="powered-logo">
</footer>

<a href="about.html" class="about-btn">About Us</a>

</body>
</html>
