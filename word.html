<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Word – Speed Articulation</title>
<link rel="stylesheet" href="style.css">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body class="app">

<!-- Top Nav -->
<nav class="top-nav">
  <div class="nav-inner">
    <div class="nav-left">
      <a href="dashboard.html" class="nav-logo">
        <img src="logo.png" alt="Logo">
        <span>Pronunciation Trainer</span>
      </a>
    </div>
    <div class="nav-links">
      <a href="dashboard.html">Dashboard</a>
      <a href="inbox.html">Inbox</a>
      <a href="assignments.html">Assignments</a>
      <a href="ipa.html">IPA Chart</a>
      <a href="speed-articulation.html">Speed</a>
      <a href="games.html">Games</a>
    </div>
  </div>
</nav>

<main class="home">
  <div class="sound-card">
    <div id="wordTitle" class="sound-symbol">?</div>
    <p id="wordType" class="sound-name"></p>
    <p id="ipa" class="ipa-pronunciation"></p>

    <button id="playBtn" class="select-btn">Play Audio</button>

    <div class="instructions" id="instructions"></div>

    <div id="illustrationContainer"></div>
  </div>
</main>

<footer class="site-footer">
  <p>Powered by</p>
  <img src="images/powered-by-logo.png" alt="Powered by logo" class="powered-logo">
</footer>

<script>
// Get word from URL
const params = new URLSearchParams(window.location.search);
const word = params.get("word");

// Define words and their data
const words = {
  Pikke: {
    type: "Type A",
    ipa: "/.pikːe/",
    audio: "sounds/Pikke.mp3",
    instructions: "This word has a stressed first syllable, and both syllables are equally short.",
    illustration: "images/Pikke.png"
  },
  Pike: {
    type: "Type A",
    ipa: "/.pike/",
    audio: "sounds/Pike.mp3",
    instructions: "This word has a stressed first syllable, and both syllables are equally short.",
    illustration: "images/Pike.png"
  },
  Piike: {
    type: "Type B",
    ipa: "/piː.ke/",
    audio: "sounds/Piike.mp3",
    instructions: "This word has a stressed second syllable, and the first syllable is twice as long as the second.",
    illustration: "images/Piike.png"
  },
  Pikee: {
    type: "Type B",
    ipa: "/pi.keː/",
    audio: "sounds/Pikee.mp3",
    instructions: "This word has a stressed second syllable, and the second syllable is twice as long as the first.",
    illustration: "images/Pikee.png"
  },
  Edi: {
    type: "Type C",
    ipa: "/.edi/",
    audio: "sounds/Edi.mp3",
    instructions: "This word has a stressed second syllable, and both syllables are equally short.",
    illustration: "images/Edi.png"
  },
  Eti: {
    type: "Type C",
    ipa: "/.eti/",
    audio: "sounds/Eti.mp3",
    instructions: "This word has a stressed second syllable, and both syllables are equally short.",
    illustration: "images/Eti.png"
  }
};

// Populate page
if (words[word]) {
  document.getElementById("wordTitle").textContent = word;
  document.getElementById("wordType").textContent = words[word].type;
  document.getElementById("ipa").textContent = words[word].ipa;
  document.getElementById("instructions").textContent = words[word].instructions;

  // Audio button
  document.getElementById("playBtn").onclick = () => {
    new Audio(words[word].audio).play();
  };

  // Illustration
  const imgContainer = document.getElementById("illustrationContainer");
  const img = document.createElement("img");
  img.src = words[word].illustration;
  img.alt = `${word} pronunciation illustration`;
  img.style.maxWidth = "60%";
  img.style.display = "block";
  img.style.margin = "1rem auto 0";
  imgContainer.appendChild(img);
} else {
  document.getElementById("wordTitle").textContent = "Word not found";
  document.getElementById("instructions").textContent = "";
}
</script>

</body>
</html>

</script>

</body>
</html>
