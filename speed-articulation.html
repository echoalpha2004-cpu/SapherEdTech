<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Speed Articulation</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Top navigation (reuse your existing nav later if you want) -->
  <nav class="top-nav">
    <a href="dashboard.html" class="nav-logo">
      <span>Pronunciation Trainer</span>
    </a>
  </nav>

  <main>

    <section class="speed-articulation">

      <h1>Speed Articulation</h1>

      <div class="type-buttons">
        <button data-type="a" class="active">Type A</button>
        <button data-type="b">Type B</button>
        <button data-type="c">Type C</button>
      </div>

      <div class="type-description" id="type-description">
        <p>Type A description goes here.</p>
      </div>

      <div class="word-bank">
        <button class="word" data-type="a">Pikke</button>
        <button class="word" data-type="a">Pike</button>

        <button class="word" data-type="b">Piike</button>
        <button class="word" data-type="b">Pikee</button>

        <button class="word" data-type="c">Edi-1</button>
        <button class="word" data-type="c">Edi-2</button>
      </div>

    </section>

  </main>

  <script src="speed-articulation.js"></script>
</body>
</html>
