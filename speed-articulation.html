<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Speed Articulation – Pronunciation Trainer</title>
<link rel="stylesheet" href="style.css">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body class="app">

<!-- Top Nav (same as other pages) -->
<nav class="top-nav">
  <div class="nav-inner">
    <div class="nav-left">
      <a href="dashboard.html" class="nav-logo">
        <img src="logo.png" alt="Logo">
        <span>Pronunciation Trainer</span>
      </a>
    </div>

    <div class="nav-links">
      <a href="dashboard.html">Dashboard</a>
      <a href="inbox.html">Inbox</a>
      <a href="assignments.html">Assignments</a>
      <a href="ipa.html">IPA Chart</a>
      <a href="games.html">Games</a>
    </div>
  </div>
</nav>

<main class="home">
  <header class="dash-header">
    <img src="logo.png" class="dash-logo" alt="Logo">
    <span class="app-name">Speed Articulation</span>
  </header>

  <!-- Type Buttons -->
<h3 class="section-title">Word Rhythm Types</h3>
  <div class="type-buttons">
  <button class="dash-btn type-btn" data-type="a">Type A</button>
  <button class="dash-btn type-btn" data-type="b">Type B</button>
  <button class="dash-btn type-btn" data-type="c">Type C</button>
  <button class="dash-btn type-btn" data-type="all">Show All</button>
</div>

  <!-- Type Description -->
  <p id="typeDescription" class="type-description"></p>

  <!-- Word Bank -->
<h3 class="section-title">Word Bank</h3>
<div id="wordBank" class="word-bank">
  <button class="dash-btn word-btn" data-type="a">Pikke</button>
  <button class="dash-btn word-btn" data-type="a">Pike</button>
  <button class="dash-btn word-btn" data-type="b">Piike</button>
  <button class="dash-btn word-btn" data-type="b">Pikee</button>
  <button class="dash-btn word-btn" data-type="c">Edi</button>
  <button class="dash-btn word-btn" data-type="c">Eti</button>
</div>
</main>

<footer class="site-footer">
  <p>Powered by</p>
  <img src="images/powered-by-logo.png" alt="Powered by logo" class="powered-logo">
</footer>

<script>
// Type descriptions object
const typeDescriptions = {
  a: "The primary stress of the word falls on the first syllable. Both syllables are read at equally short length",
  b: "The primary stress of the word falls on the second syllable. The consonant with two vowels is read at double the length of short length",
  c: "The primary stress of the word falls on the second syllable. Both syllables are read at equally short length"
};

const typeButtons = document.querySelectorAll(".type-btn");
const wordButtons = document.querySelectorAll(".word-btn");
const descriptionEl = document.getElementById("typeDescription");

// Handle type button click
typeButtons.forEach(btn => {
  btn.addEventListener("click", () => {
    const type = btn.dataset.type;

    // Update description (clear if 'all')
    descriptionEl.textContent = type === "all" ? "" : typeDescriptions[type] || "";

    // Filter word buttons
    wordButtons.forEach(wordBtn => {
      if (type === "all" || wordBtn.dataset.type === type) {
        wordBtn.style.display = "inline-block"; // show
      } else {
        wordBtn.style.display = "none";         // hide
      }
    });
  });
});

// Make word buttons open word.html
wordButtons.forEach(wordBtn => {
  wordBtn.addEventListener("click", () => {
    const word = wordBtn.textContent; // or use wordBtn.dataset.word if you prefer
    window.location.href = `word.html?word=${encodeURIComponent(word)}`;
  });
});

</script>

</body>
</html>
