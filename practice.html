<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Pronunciation Practice</title>
<link rel="stylesheet" href="style.css">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body>
<main class="practice-page">

  <header class="dash-header">
    <img src="logo.png" class="dash-logo">
    <span class="app-name">Pronunciation Practice</span>
  </header>

  <h2>Your Practice Sounds</h2>
  <p>Select a sound to hear it and practice.</p>

  <div id="practiceGrid" class="ipa-grid"></div>

  <p id="emptyMsg" class="empty-msg"></p>

</main>

<script>
const sounds = {
  p: "sounds/p.mp3",
  b: "sounds/b.mp3",
  i: "sounds/i.mp3",
  t: "sounds/t.mp3",
  d: "sounds/d.mp3",
  a: "sounds/a.mp3"
};

const grid = document.getElementById("practiceGrid");
const emptyMsg = document.getElementById("emptyMsg");

const pins = JSON.parse(localStorage.getItem("practicePins")) || [];

if (pins.length === 0) {
  emptyMsg.textContent = "You haven't pinned any sounds yet. Go to the IPA chart to add some.";
}

pins.forEach(sound => {
  const btn = document.createElement("button");
  btn.className = "ipa";
  btn.textContent = sound;

  btn.onclick = () => {
    if (sounds[sound]) {
      new Audio(sounds[sound]).play();
    }
  };

  grid.appendChild(btn);
});
</script>

<a href="about.html" class="about-btn">About Us</a>

</body>
</html>
