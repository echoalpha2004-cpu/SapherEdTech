<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Pronunciation Practice</title>
<link rel="stylesheet" href="style.css">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body>

<nav class="top-nav">
  <div class="nav-inner">
    <div class="nav-left">
      <a href="dashboard.html" class="nav-logo">
        <img src="logo.png" alt="Logo">
        <span>Pronunciation Trainer</span>
      </a>
    </div>

    <div class="nav-links">
      <a href="dashboard.html">Dashboard</a>
      <a href="inbox.html">Inbox</a>
      <a href="assignments.html">Assignments</a>
      <a href="ipa.html">IPA Chart</a>
      <a href="speed-articulation.html">Speed</a>

      <a href="games.html">Games</a>
      <a href="conlangs.html">Conlangs</a>
    </div>
  </div>
</nav>
  
<main class="practice-page">

  <header class="dash-header">
    <span class="app-name">Practice</span>
  </header>

  <p class="ipa-instructions">
    Sounds you’ve pinned for focused practice.
  </p>

  <div id="practiceGrid" class="ipa-grid"></div>

  <p id="emptyPractice" class="ipa-instructions" style="display:none;">
    You haven’t pinned any sounds yet.
  </p>

</main>

<script>
const practiceGrid = document.getElementById("practiceGrid");
const emptyMsg = document.getElementById("emptyPractice");

const pins = JSON.parse(localStorage.getItem("practicePins")) || [];

if (pins.length === 0) {
  emptyMsg.style.display = "block";
} else {
  pins.forEach(sound => {
    const btn = document.createElement("a");
    btn.href = `sound.html?sound=${sound}`;
    btn.className = "ipa";
    btn.textContent = sound;
    practiceGrid.appendChild(btn);
  });
}
</script>


<footer class="site-footer">
  <p>Powered by</p>
  <img src="images/powered-by-logo.png" alt="Powered by logo" class="powered-logo">
</footer>

</body>
</html>
