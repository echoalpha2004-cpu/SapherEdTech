<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>My Conlangs – Pronunciation Trainer</title>
<link rel="stylesheet" href="style.css">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body class="app">

<!-- Top Nav -->
<nav class="top-nav">
  <div class="nav-inner">
    <div class="nav-left">
      <a href="dashboard.html" class="nav-logo">
        <img src="logo.png" alt="Logo">
        <span>Pronunciation Trainer</span>
      </a>
    </div>

    <div class="nav-links">
      <a href="dashboard.html">Dashboard</a>
      <a href="inbox.html">Inbox</a>
      <a href="assignments.html">Assignments</a>
      <a href="ipa.html">IPA Chart</a>
      <a href="speed-articulation.html">Speed</a>
      <a href="games.html">Games</a>
      <a href="conlangs.html">Conlangs</a>
    </div>
  </div>
</nav>

<main class="home">
  <header class="dash-header">
    <span class="app-name">My Languages</span>
  </header>

  <div id="langList" class="content-box"></div>
</main>

<script>
const container = document.getElementById("langList");
const langs = JSON.parse(localStorage.getItem("conlangs")) || [];

container.innerHTML = "";

langs.forEach(lang => {
  const div = document.createElement("div");
  div.className = "language-card";

  div.innerHTML = `
    <h3>${lang.name}</h3>
    <button class="dash-btn" onclick="editLang(${lang.id})">Edit</button>
    <button class="dash-btn" onclick="deleteLang(${lang.id})">Delete</button>
  `;

  container.appendChild(div);
});

function editLang(id) {
  window.location.href = `conlang-edit.html?id=${id}`;
}

function deleteLang(id) {
  const updated = langs.filter(l => l.id !== id);
  localStorage.setItem("conlangs", JSON.stringify(updated));
  location.reload();
}
</script>

</body>
</html>
