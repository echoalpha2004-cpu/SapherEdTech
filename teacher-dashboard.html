<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Teacher Dashboard – Pronunciation Trainer</title>
<link rel="stylesheet" href="style.css">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body>

<nav class="top-nav">
  <div class="nav-inner">
    <div class="nav-left">
      <a href="teacher-dashboard.html" class="nav-logo">
        <img src="logo.png" alt="Logo">
        <span>Pronunciation Trainer</span>
      </a>
    </div>

    <div class="nav-links">
      <a href="teacher-classwork.html">Classwork</a>
      <a href="teacher-students.html">Students</a>
      <a href="teacher-announcements.html">Announcements</a>
      <a href="index.html">Log Out</a>
    </div>
  </div>
</nav>

<main class="dashboard">

  <header class="dash-header">
    <img src="logo.png" alt="App Logo" class="dash-logo">
    <span class="app-name">Pronunciation Trainer</span>
  </header>

  <div class="profile">
  <img src="images/pfp.png" alt="Profile Picture" class="pfp" id="profilePic">
  <h2>John Doe - Student</h2>
  <p class="language-label">Currently Learning: Outlandish</p>

  <button id="changePicBtn" class="dash-btn">Change Profile Picture</button>

  <div id="pfpOptions" class="pfp-options" style="display: none;">
    <img src="images/pfp.png" class="pfp-choice">
    <img src="images/cat.png" class="pfp-choice">
    <img src="images/pigeon.png" class="pfp-choice">
    <img src="images/snake.png" class="pfp-choice">
    <img src="images/frog.png" class="pfp-choice">
  </div>
</div>

<div class="dashboard-buttons">
  <a href="teacher-students.html" class="dash-btn">Students</a>
  <a href="teacher-announcements.html" class="dash-btn">Announcements</a>
  <a href="teacher-classwork.html" class="dash-btn">Classwork</a>
  <a href="index.html" class="dash-btn">Log out</a>
</div>

</main>

<footer class="site-footer">
  <p>Powered by</p>
  <img src="images/powered-by-logo.png" alt="Powered by logo" class="powered-logo">
</footer>

<a href="about.html" class="about-btn">About Us</a>

<script>
const profilePic = document.getElementById("profilePic");
const changeBtn = document.getElementById("changePicBtn");
const options = document.getElementById("pfpOptions");
const choices = document.querySelectorAll(".pfp-choice");

// Load saved profile pic
const savedPic = localStorage.getItem("profilePic");
if (savedPic) {
  profilePic.src = savedPic;
}

// Toggle options
changeBtn.onclick = () => {
  options.style.display = options.style.display === "none" ? "flex" : "none";
};

// Select new profile pic
choices.forEach(img => {
  img.onclick = () => {
    profilePic.src = img.src;
    localStorage.setItem("profilePic", img.src);
    options.style.display = "none";
  };
});
</script>

</body>
</html>
