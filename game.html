<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Game Instructions</title>
<link rel="stylesheet" href="style.css">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body>
<main class="home">

  <header class="dash-header">
    <img src="logo.png" class="dash-logo">
    <span class="app-name">Game Instructions</span>
  </header>

  <h2 id="gameTitle"></h2>
  <p id="gameInstructions"></p>

</main>

<script>
const params = new URLSearchParams(window.location.search);
const game = params.get("game");

const games = {
  soundBingo: {
    title: "Speech Bingo",
    instructions: "Students receive bingo cards with IPA sounds. The instructor plays sounds aloud. Students mark the sounds they hear. First to complete a row wins."
  },
  ipaRace: {
    title: "IPA Race",
    instructions: "Teams race to correctly identify, pronounce, or locate IPA symbols on a chart based on the instructor’s prompts."
  }
};

if (games[game]) {
  document.getElementById("gameTitle").textContent = games[game].title;
  document.getElementById("gameInstructions").textContent = games[game].instructions;
}
</script>

</body>
</html>
