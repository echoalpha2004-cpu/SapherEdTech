<main class="home">

  <header class="dash-header">
    <span class="app-name">Game Instructions</span>
  </header>

  <h2 id="gameTitle"></h2>
  <ol id="gameInstructions" class="game-instructions"></ol>
  <img id="gameBoard" class="game-board" alt="Game board">
  
  <div id="coinSection" class="coin-container" hidden>
  <img
    id="coin"
    src="images/name.png"
    alt="Coin showing Name"
  >

  <button id="flipCoinBtn" class="coin-btn">Flip Coin</button>

  <div class="stopwatch">

  <h3>Game Timer</h3>

  <div id="timeDisplay" class="timer-display">
    00:00.00
  </div>

  <div class="timer-buttons">
    <button onclick="startTimer()" class="dash-btn">Start</button>
    <button onclick="stopTimer()" class="dash-btn secondary">Stop</button>
    <button onclick="resetTimer()" class="dash-btn secondary">Reset</button>
  </div>

</div>
</div>

</main>

<script>
const params = new URLSearchParams(window.location.search);
const game = params.get("game");

const games = {
  speechBingo: {
    title: "Speech Bingo",
    instructions: [
      "All players begin on the centre square.",
      "Flip the coin to determine the phoneme sound or name.",
      "Correctly identify the sound or its name to advance 1 square.",
      "The turn passes to the next player.",
      "The first player to return to the centre square wins."
    ],
    boardImage: "images/board.png"
  },

  ipaRace: {
    title: "IPA Race",
    instructions: [
      "All players begin on the centre square.",
      "The teacher assigns phonemes to each player.",
      "Players form sentences using the assigned phonemes.",
      "Each correct occurrence advances the player one square."
    ],
    boardImage: "images/board.png"
  }
};


if (games[game]) {
  
  document.getElementById("gameTitle").textContent = games[game].title;

  const instructionsEl = document.getElementById("gameInstructions");
  instructionsEl.innerHTML = "";

  games[game].instructions.forEach(step => {
    const li = document.createElement("li");
    li.textContent = step;
    instructionsEl.appendChild(li);
  });

// Show coin only for Speech Bingo
if (game === "speechBingo") {
  document.getElementById("coinSection").hidden = false;
}

}  // ← THIS was missing

const boardImg = document.getElementById("gameBoard");
boardImg.src = games[game].boardImage;

const coin = document.getElementById("coin");
const flipBtn = document.getElementById("flipCoinBtn");

if (coin && flipBtn) {
  flipBtn.addEventListener("click", () => {
    const result = Math.random() < 0.5 ? "name" : "sound";

    // visual feedback
    flipBtn.classList.add("pressed");

    setTimeout(() => {
      coin.src = `images/${result}.png`;
      coin.alt = `Coin showing ${result}`;
      flipBtn.classList.remove("pressed");
    }, 200);
  });
}

let timer = null;
let startTime = 0;
let elapsed = 0;
let running = false;

const display = document.getElementById("timeDisplay");

function startTimer() {
  if (running) return;

  running = true;
  startTime = Date.now() - elapsed;

  timer = setInterval(updateTimer, 10);
}

function stopTimer() {
  running = false;
  clearInterval(timer);
}

function resetTimer() {
  running = false;
  clearInterval(timer);
  elapsed = 0;
  display.textContent = "00:00.00";
}

function updateTimer() {
  elapsed = Date.now() - startTime;

  const minutes = Math.floor(elapsed / 60000);
  const seconds = Math.floor((elapsed % 60000) / 1000);
  const milliseconds = Math.floor((elapsed % 1000) / 10);

  display.textContent =
    `${String(minutes).padStart(2,"0")}:` +
    `${String(seconds).padStart(2,"0")}.` +
    `${String(milliseconds).padStart(2,"0")}`;
}

</script>
