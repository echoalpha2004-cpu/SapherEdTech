<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Game Instructions</title>
<link rel="stylesheet" href="style.css">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body>
<main class="home">

  <header class="dash-header">
    <img src="logo.png" class="dash-logo">
    <span class="app-name">Game Instructions</span>
  </header>

  <h2 id="gameTitle"></h2>
  <p id="gameInstructions"></p>

</main>

<script>
const params = new URLSearchParams(window.location.search);
const game = params.get("game");

const games = {
  soundBingo: {
    title: "Speech Bingo",
    instructions: "Starting players begin in the centre square. Upon flipping the coin, the side facing up determines the sound of a phoneme or the name of a phoneme. The player then advances 1 square upon correctly identifying the sound's name or pronunciation, and the turn goes to the next player. The first player who returns to the starting square wins the game"
  },
  ipaRace: {
    title: "IPA Race",
    instructions: "Starting players begin in the centre square. The teacher assigns phonemes to players during their turn. Players must form sentences using designated phonemes in the words. The quantity of the phoneme's occurance in the sentence determines how many squares the player advances."
  }
};

if (games[game]) {
  document.getElementById("gameTitle").textContent = games[game].title;
  document.getElementById("gameInstructions").textContent = games[game].instructions;
}
</script>

</body>
</html>
