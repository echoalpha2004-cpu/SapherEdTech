<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Inbox</title>
<link rel="stylesheet" href="style.css">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body>
<main class="home">

  <header class="dash-header">
    <img src="logo.png" alt="App Logo" class="dash-logo">
    <span class="app-name">Inbox</span>
  </header>

  <section class="inbox">

    <div class="message unread">
      <h3>Instructor</h3>
      <p>Reminder: Speech Bingo will be played in class tomorrow.</p>
      <span class="timestamp">Today</span>
    </div>

    <div class="message">
      <h3>Instructor</h3>
      <p>Your IPA Race assignment has been reviewed. Good work!</p>
      <span class="timestamp">Yesterday</span>
    </div>

    <div class="message">
      <h3>System</h3>
      <p>Welcome to Pronunciation Trainer 🎉</p>
      <span class="timestamp">3 days ago</span>
    </div>

  </section>

</main>

<footer class="site-footer">
  <p>Powered by</p>
  <img src="images/powered-by-logo.png" alt="Powered by logo" class="powered-logo">
</footer>

</body>
</html>
