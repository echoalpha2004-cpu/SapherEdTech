<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Conlang Viewer – Pronunciation Trainer</title>
<link rel="stylesheet" href="style.css">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body class="app">

<nav class="top-nav">
  <div class="nav-inner">
    <a href="conlang-hub.html" class="nav-logo">
      <img src="logo.png" alt="Logo">
      <span>Conlang Library</span>
    </a>
  </div>
</nav>

<main class="home">

  <header class="dash-header">
    <span class="app-name" id="langName">Language</span>
  </header>

  <div class="content-box">
    <h3>Phonology</h3>
    <p id="phonology"></p>
  </div>

  <div class="content-box">
    <h3>Pronouns</h3>
    <p id="pronouns"></p>
  </div>

  <div class="content-box">
    <h3>Verbs</h3>
    <p id="verbs"></p>
  </div>

  <div class="content-box">
    <h3>Cardinal Numbers</h3>
    <p id="numbers"></p>
  </div>

</main>

<footer class="site-footer">
  <p>Powered by</p>
  <img src="images/powered-by-logo.png" class="powered-logo">
</footer>

<script>
/* ---------- FEATURED CONLANGS ---------- */
const featuredConlangs = {
  Daveltic: {
    phonology: "Consonant-heavy system with emphatic stress.",
    pronouns: "Three-person system with inclusive/exclusive distinction.",
    verbs: "Aspect-driven verbal morphology.",
    numbers: "Base-12 numeral system."
  },
  Taremi: {
    phonology: "Vowel harmony with uvular contrasts.",
    pronouns: "Gender-neutral pronouns only.",
    verbs: "Agglutinative tense marking.",
    numbers: "Base-10 with compound forms."
  },
  Keshan: {
    phonology: "Pitch accent with long vowels.",
    pronouns: "Politeness-based pronoun hierarchy.",
    verbs: "Prefix-based agreement.",
    numbers: "Base-5 counting system."
  }
};

/* ---------- LOAD PARAMS ---------- */
const params = new URLSearchParams(window.location.search);
const id = params.get("id");
const featured = params.get("featured");

let language = null;

/* ---------- USER-CONSTRUCTED ---------- */
if (id) {
  const saved = JSON.parse(localStorage.getItem("conlangs")) || [];
  language = saved.find(l => l.id === id);
}

/* ---------- FEATURED ---------- */
if (!language && featured && featuredConlangs[featured]) {
  language = {
    name: featured,
    ...featuredConlangs[featured]
  };
}

/* ---------- RENDER ---------- */
if (!language) {
  document.getElementById("langName").textContent = "Language not found";
} else {
  document.getElementById("langName").textContent = language.name;
  document.getElementById("phonology").textContent = language.phonology || "—";
  document.getElementById("pronouns").textContent = language.pronouns || "—";
  document.getElementById("verbs").textContent = language.verbs || "—";
  document.getElementById("numbers").textContent = language.numbers || "—";
}
</script>

<a href="about.html" class="about-btn">About Us</a>
  
</body>
</html>
