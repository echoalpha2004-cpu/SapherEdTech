<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Conlang – Pronunciation Trainer</title>
<link rel="stylesheet" href="style.css">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body class="app">

<nav class="top-nav">
  <div class="nav-inner">
    <a href="conlang-hub.html" class="nav-logo">
      <span>← Back to Conlangs</span>
    </a>
  </div>
</nav>

<main class="home">

  <div class="content-box ipa-box">

    <h2 id="langName">Language Name</h2>

    <section>
      <h3>Phonology</h3>
      <p id="phonology"></p>
    </section>

    <section>
      <h3>Pronouns</h3>
      <p id="pronouns"></p>
    </section>

    <section>
      <h3>Verbs</h3>
      <p id="verbs"></p>
    </section>

    <section>
      <h3>Cardinal Numbers</h3>
      <p id="numbers"></p>
    </section>

  </div>

</main>

<footer class="site-footer">
  <p>Powered by</p>
  <img src="images/powered-by-logo.png" class="powered-logo">
</footer>

<script>
// TEMP mock data — replace with real data later
const conlangs = {
  Daveltic: {
    phonology: "Rich vowel harmony, ejective consonants",
    pronouns: "Three-person system with animacy distinction",
    verbs: "Aspect-heavy, minimal tense marking",
    numbers: "Base-12 system"
  },
  Taremi: {
    phonology: "Simple CV syllables, pitch accent",
    pronouns: "Gender-neutral",
    verbs: "Agglutinative",
    numbers: "Base-10"
  }
};

const params = new URLSearchParams(window.location.search);
const lang = params.get("lang");

if (lang && conlangs[lang]) {
  document.getElementById("langName").textContent = lang;
  document.getElementById("phonology").textContent = conlangs[lang].phonology;
  document.getElementById("pronouns").textContent = conlangs[lang].pronouns;
  document.getElementById("verbs").textContent = conlangs[lang].verbs;
  document.getElementById("numbers").textContent = conlangs[lang].numbers;
}
</script>

</body>
</html>
