<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Announcements</title>
<link rel="stylesheet" href="style.css">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>

<nav class="top-nav">
  <div class="nav-inner">
    <div class="nav-left">
      <a href="teacher-dashboard.html" class="nav-logo">
        <img src="logo.png" alt="Logo">
        <span>Pronunciation Trainer</span>
      </a>
    </div>

    <div class="nav-links">
      <a href="teacher-classwork.html">Classwork</a>
      <a href="teacher-students.html">Students</a>
      <a href="teacher-announcements.html">Announcements</a>
      <a href="index.html">Log Out</a>
    </div>
  </div>
</nav>

<main class="announcements-page builder-page">

  <header class="dash-header">
    <span class="app-name">Announcements</span>
  </header>

  <div class="builder-card">
    <input type="text" id="announcementInput" placeholder="Write new announcement">
    <button class="dash-btn" onclick="addAnnouncement()">Post Announcement</button>
  </div>

  <h2>Existing Announcements</h2>
  <div id="announcementList"></div>

</main>

<script>

function getAnnouncements() {
  return JSON.parse(localStorage.getItem("announcements") || "[]");
}

function saveAnnouncements(list) {
  localStorage.setItem("announcements", JSON.stringify(list));
}

function renderAnnouncements() {
  const listDiv = document.getElementById("announcementList");
  listDiv.innerHTML = "";

  const announcements = getAnnouncements();

  announcements.forEach((text, index) => {

    const div = document.createElement("div");
    div.className = "announcement-item";

    div.innerHTML = `
      <p>${text}</p>
      <button onclick="deleteAnnouncement(${index})" class="dash-btn secondary">Delete</button>
    `;

    listDiv.appendChild(div);
  });
}

function addAnnouncement() {
  const text = document.getElementById("announcementText").value;
  if (!text) return;

  const announcements = getAnnouncements();
  announcements.push(text);
  saveAnnouncements(announcements);

  document.getElementById("announcementText").value = "";
  renderAnnouncements();
}

function deleteAnnouncement(index) {
  const announcements = getAnnouncements();
  announcements.splice(index, 1);
  saveAnnouncements(announcements);
  renderAnnouncements();
}

renderAnnouncements();

</script>

<footer class="site-footer">
  <p>Powered by</p>
  <img src="images/powered-by-logo.png" alt="Powered by logo" class="powered-logo">
</footer>

<a href="about.html" class="about-btn">About Us</a>

</body>
</html>
