<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Announcements</title>
<link rel="stylesheet" href="style.css">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>

<nav class="top-nav">
  <div class="nav-inner">
    <div class="nav-left">
      <a href="teacher-dashboard.html" class="nav-logo">
        <img src="logo.png" alt="Logo">
        <span>Pronunciation Trainer</span>
      </a>
    </div>

    <div class="nav-links">
      <a href="teacher-classwork.html">Classwork</a>
      <a href="teacher-students.html">Students</a>
      <a href="teacher-announcements.html">Announcements</a>
      <a href="index.html">Log Out</a>
    </div>
  </div>
</nav>
  
<main class="announcements-page builder-page">

  <header class="dash-header">
    <span class="app-name">Announcements</span>
  </header>

  <div class="builder-card">
    <input type="text" id="announcementInput" placeholder="Write new announcement">
    <button class="dash-btn" onclick="addAnnouncement()">Post Announcement</button>
  </div>

  <h2>Existing Announcements</h2>
  <div id="announcementList"></div>

</main>

<script>
function loadInbox() {
  const inbox = document.getElementById("inboxList");
  if (!inbox) return;

  const announcements = JSON.parse(localStorage.getItem("announcements") || "[]");

  announcements.forEach(text => {
    const div = document.createElement("div");
    div.className = "message unread";
    div.innerHTML = `
      <h3>Instructor</h3>
      <p>${text}</p>
      <span class="timestamp">New</span>
    `;
    inbox.appendChild(div);
  });
}

loadInbox();
</script>

<footer class="site-footer">
  <p>Powered by</p>
  <img src="images/powered-by-logo.png" alt="Powered by logo" class="powered-logo">
</footer>

<a href="about.html" class="about-btn">About Us</a>

</body>
</html>
